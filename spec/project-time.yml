feature: project-time
status: stable
requirements:
  - id: top_level_human_activity
    title: Top-level human-active intervals
    requirement: Record an immutable human_active interval for prompt-driven active collaboration in every top-level OMP session, including session identity, sanitized project label, one-way repository hash, optional normalized remote host/path identity, interval bounds, and a coarse activity label generated transiently from the current prompt. Retain the previous valid label when generation produces no valid label; use General Work when none exists.
    rationale: Human-active evidence is useful collaboration context without claiming idle terminal, literal desk time, or paid duration.
  - id: agent_turn_evidence
    title: Separate agent-turn evidence
    requirement: Record agent_turn_elapsed intervals from before_agent_start through turn_end for top-level OMP sessions, with the same identity and interval fields as human-active intervals.
    rationale: Agent execution is useful parallel evidence but must remain distinguishable from human collaboration.
  - id: source_separation
    title: Separate automatic evidence sources
    requirement: Keep human_active and agent_turn_elapsed entries separate; never automatically add one source to another or label prompt windows as billable.
    rationale: Separate observations must not become an unreviewable billing decision.
  - id: concurrent_projects
    title: Concurrent project evidence
    requirement: Preserve full raw intervals for concurrent repositories in the evidence snapshot.
    rationale: Concurrent repository activity is evidence, not an allocation decision.
  - id: versioned_raw_evidence
    title: Versioned raw evidence snapshot
    requirement: "`entries` must emit the public omp-project-time/evidence v1 snapshot of raw automatic entries. The owner-only SQLite ledger must preserve every snapshot field and, on first access, transactionally import valid legacy automatic JSON ledger entries while leaving the original JSON file intact as a rollback backup. Invalid legacy JSON must remain untouched and unimported. Every snapshot entry retains its stable ID, source kind, project and repository identity, bounds, creation time, activity, optional narrative, optional work item, and explicit work-item provenance. A provenance change creates a new interval segment; ambiguous references remain unassigned rather than guessed."
    rationale: Downstream review tools need a stable, non-aggregated evidence contract without coupling to internal storage or silently assigning a task.
  - id: top_level_only
    title: Top-level sessions only
    requirement: Subagent and artifact sessions must not create or display their own Project Time intervals.
    rationale: Their activity belongs to the top-level session and otherwise risks double counting.
  - id: local_privacy
    title: Local privacy boundary
    requirement: Persist only a sanitized project label, one-way repository hash, optional normalized lowercase remote host/path identity without a protocol or credential, source kind, session identity, timing, and a coarse activity label generated transiently from the current prompt. Do not persist working-directory paths, raw remote URLs, credentials, prompts, assignments, transcripts, tool output, artifacts, session names, session files, file paths, model metadata, or custom attribution.
    rationale: Time tracking must not create sensitive activity logging.
  - id: settings_ui
    title: Clear plugin settings
    requirement: Expose only the scalar Active Window Minutes, Refresh Interval Seconds, and Status Label settings with Title Case labels and action-oriented descriptions.
    rationale: OMP's plugin settings UI supports native boolean, string, number, and enum values, not structured configuration documents.
  - id: local_views
    title: Minimal local views
    requirement: The status line and bare command show current top-level session state. `entries` accepts one final exact `--project NAME` selector and returns only local evidence. A selected bare dashboard reads the local ledger rather than claiming remote live session state.
    rationale: Keep live status distinct from persisted evidence while limiting the public query surface to one export.
non_requirements:
  - id: no_automatic_desk_clock
    description: Project Time does not infer desk time from prompts, agent turns, refreshes, or idle terminal state.
  - id: no_external_billing
    description: Project Time does not calculate money, rates, client policy, invoices, or external time-entry payloads.
  - id: no_automatic_source_aggregation
    description: Project Time does not aggregate agent_turn_elapsed and human_active time.
  - id: no_local_allocation_reports
    description: Project Time does not calculate raw, split, or weighted project allocations; downstream tools may make an explicit allocation decision from raw evidence.
  - id: no_local_coverage_diagnostics
    description: Project Time does not calculate date coverage, inactive gaps, spans, or concurrent overlap diagnostics.
  - id: no_repository_attribution
    description: Project Time does not configure repository-to-project, category, or task mappings.
  - id: no_inline_status_until_omp_support
    description: Project Time uses ctx.ui.setStatus on OMP's separate hook-status lines; it does not provide plugin-defined inline status segments.
